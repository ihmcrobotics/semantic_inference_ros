[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-inference-python"
version = "0.0.1"
description = "Python models and utilities for ROS 2 semantic inference"
license = { text = "BSD-3-Clause" }
maintainers = [
  { name = "Arghya Chatterjee", email = "achatterjee@ihmc.org" },
]
dependencies = [
  "accelerate==1.0.1",
  "attrdict==2.0.1",
  "clip @ git+https://github.com/openai/CLIP.git",
  "click==8.1.7",
  "distinctipy==1.3.4",
  "einops==0.8.0",
  "imageio==2.35.1",
  "gdown==5.2.0",
  "numpy==1.26.4",
  "onnx==1.17.0",
  "open-clip-torch==2.29.0",
  "openai==1.97.0",
  "pandas==2.2.3",
  "pyyaml==6.0.2",
  "rospkg==1.5.1",
  "scipy==1.14.1",
  "seaborn==0.13.2",
  "sentencepiece==0.2.0",
  "supervision==0.18.0",
  "timm==1.0.11",
  "torch==2.4.1",
  "torchvision==0.19.1",
  "transformers==4.57.6",
  "ultralytics==8.4.121",
]

[project.optional-dependencies]
tensorrt = [
  "tensorrt==11.2.1.2; platform_system == 'Linux' and platform_machine == 'x86_64'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
