---
model:
  segmentation:
    type: yolo
    yolo_model_name: $SCENE_GRAPH_ASSETS/models/segmentation/pretrained/yolov8/yolov8l-seg.engine
    confidence: 0.4
    iou: 0.85
    output_size: 640
    verbose: false

  refinement:
    dilate_masks: true

  clip_model:
    type: open_clip
    model_name: ViT-B-32
    model_path: ""
    tokenizer_name: ViT-B-32
    pretrained: $SCENE_GRAPH_ASSETS/models/vlm_embedding_encoder/openclip/laion-clip-vit-b-32-s34b-b79k.safetensors

  use_dense: false
  dense_ratio: 0.9
  max_batch: 10
  text_embeddings: true
  box_embeddings: false
  mask_embeddings: true
  text_embeddings_weight: 0.9
  box_embeddings_weight: 0.0
  mask_embeddings_weight: 0.1
  cuda: true
  dense_representation_radius_m: 7.0
  min_depth: 0.05
  pub_detections: true

worker:
  queue_size: 1
  min_separation_s: 0.5

playback_mode: false
print_inference_time: false

